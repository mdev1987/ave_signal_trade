version = 1

[[apps]]
name = "watcher"
command = "uv run main.py watch"
cwd = "/home/mdev/ave_signal_trade"
restart_policy = "always"
max_restarts = 1000
crash_restart_limit = 0
restart_delay_secs = 5
stop_signal = "SIGTERM"
stop_timeout_secs = 20
health_cmd = "/usr/bin/find /home/mdev/ave_signal_trade/bot_logs/watcher.log -mmin -6"
health_interval_secs = 60
health_timeout_secs = 5
health_max_failures = 3

[apps.env]
PATH = "/usr/local/bin:/home/mdev/.local/bin:/usr/local/bin:/usr/bin:/bin"
HOME = "/home/mdev"
# ^ mirror of the working VPS config. Local dev: edit cwd/PATH then:
#   git update-index --skip-worktree oxfile.toml
