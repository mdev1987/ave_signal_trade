[project]
name = "ave-signal-trade"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ai-cloudscraper>=3.8.4",
    "aiohttp>=3.14.3",
    "base58>=2.1.1",
    "dexscreener-python>=0.1.1",
    "httpx>=0.28.1",
    "jupiter-swap-python>=0.1.1",
    "madeonsol-x402>=1.29.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "solana-rpc-resilient>=0.1.1",
    "solders>=0.29.0",
    "telegramify-markdown>=1.2.0",
    "telethon>=1.44.0",
    "tgdata>=0.0.7",
    "websockets>=17.0.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# NOTE on BLE001 (blind `except Exception`): this codebase treats broad
# catches as load-bearing safety architecture, not tech debt. Every entry
# gate (DBotX, RugCheck, Helius, Vybe, CabalSpy, Jupiter audit) and every
# feed loop is intentionally fail-open — an unexpected exception type
# (malformed payload KeyError, transient AttributeError, etc.) must degrade
# to "allow/skip and continue", never crash the gate or kill the 24/7 loop.
# Narrowing these catches would convert unfamiliar failures into outages.
# Companion rule: S110/S112 stay enabled, so every swallowed exception is
# still LOGGED (debug or higher) — broad catches are allowed, silence is not.
ignore = ["BLE001"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
